name: Deploy to Namecheap

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Configure SSH
        env:
          RAW_NAMECHEAP_HOST: ${{ secrets.NAMECHEAP_HOST }}
          RAW_NAMECHEAP_PORT: ${{ secrets.NAMECHEAP_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.NAMECHEAP_SSH_KEY }}" > ~/.ssh/namecheap_key
          chmod 600 ~/.ssh/namecheap_key

          host="${RAW_NAMECHEAP_HOST#http://}"
          host="${host#https://}"
          host="${host#*@}"
          host="${host%%/*}"
          port="${RAW_NAMECHEAP_PORT:-22}"

          if [[ "$host" == *:* && "$host" != \[* ]]; then
            port="${host##*:}"
            host="${host%:*}"
          fi

          if [[ -z "$host" ]]; then
            echo "NAMECHEAP_HOST is empty after parsing. Set it to the Namecheap server host only."
            exit 1
          fi

          echo "NAMECHEAP_DEPLOY_HOST=$host" >> "$GITHUB_ENV"
          echo "NAMECHEAP_DEPLOY_PORT=$port" >> "$GITHUB_ENV"

      - name: Upload built assets
        run: |
          ssh -i ~/.ssh/namecheap_key \
            -p "$NAMECHEAP_DEPLOY_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 \
            "${{ secrets.NAMECHEAP_USER }}@$NAMECHEAP_DEPLOY_HOST" \
            "mkdir -p '${{ secrets.NAMECHEAP_PATH }}/public/build'"

          scp -i ~/.ssh/namecheap_key \
            -P "$NAMECHEAP_DEPLOY_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -r public/build/* \
            "${{ secrets.NAMECHEAP_USER }}@$NAMECHEAP_DEPLOY_HOST:${{ secrets.NAMECHEAP_PATH }}/public/build/"

      - name: Run deployment script
        run: |
          ssh -i ~/.ssh/namecheap_key \
            -p "$NAMECHEAP_DEPLOY_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 \
            "${{ secrets.NAMECHEAP_USER }}@$NAMECHEAP_DEPLOY_HOST" \
            "cd '${{ secrets.NAMECHEAP_PATH }}' && git pull --ff-only origin master && DEPLOY_PATH='${{ secrets.NAMECHEAP_PATH }}' DEPLOY_BRANCH='master' RUN_NPM_BUILD='false' bash ./deploy.sh"
